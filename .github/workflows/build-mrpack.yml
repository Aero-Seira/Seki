name: Build mrpack

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .mrpack
        run: python scripts/build-mrpack.py --out dist

      - name: Upload .mrpack artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seki-mrpack
          path: dist/*.mrpack
          if-no-files-found: error

      - name: Attach .mrpack to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mrpack
