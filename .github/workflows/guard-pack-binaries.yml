name: Guard pack binaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reject-tracked-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject JAR and source pack archives
        shell: bash
        run: |
          blocked="$(git ls-files -- \
            ':(glob)**/*.jar' \
            ':(glob)resourcepacks/**/*.zip' \
            ':(glob)shaderpacks/**/*.zip')"

          if [[ -n "$blocked" ]]; then
            echo "The repository must store packwiz metadata instead of source binaries:"
            echo "$blocked"
            exit 1
          fi
